name: Live site

# Every two hours: is the production site up, and do live gold and silver
# prices load? After each push to master, also: does production move to that
# commit? GitHub emails the repository owner when a run fails. Point it at
# your domain with a repository variable PRODUCTION_URL
# (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SITE: ${{ vars.PRODUCTION_URL || 'https://mizan-sandy-eight.vercel.app' }}
    steps:
      - name: Production moves to the pushed commit
        if: github.event_name == 'push'
        timeout-minutes: 12
        run: |
          want="${GITHUB_SHA:0:7}"
          got="unknown"
          for _ in $(seq 1 40); do
            got=$(curl -fsS --max-time 20 "$SITE/api/health" | jq -r '.commit // "an older build"' || echo "unreachable")
            if [ "$got" = "$want" ]; then
              echo "Production is serving $want."
              exit 0
            fi
            echo "Production is serving $got; waiting for $want…"
            sleep 15
          done
          echo "::error::Production is still serving $got, not $want. In Vercel, open the project's Deployments, then on the newest deployment choose ⋯ → Promote. A rollback or promote of an older deployment stops new ones from going live on their own."
          exit 1
      - name: The site and its database answer
        run: |
          curl -fsS --retry 3 --retry-delay 15 --max-time 20 "$SITE/api/health" | tee /dev/stderr \
            | jq -e '.ok == true' > /dev/null
      - name: Live gold and silver prices load
        run: |
          for currency in USD PKR EUR; do
            body=$(curl -fsS --retry 3 --retry-delay 15 --max-time 30 "$SITE/api/metals?currency=$currency")
            echo "$currency: $body"
            echo "$body" | jq -e '.goldPricePerGram > 0 and .silverPricePerGram > 0' > /dev/null
          done
      - name: The nisab page shows figures
        run: |
          page=$(curl -fsS --retry 3 --retry-delay 15 --max-time 30 "$SITE/nisab/pkr")
          if grep -q "Live prices are unavailable" <<< "$page"; then
            echo "/nisab/pkr is showing the unavailable notice"
            exit 1
          fi
      - name: The beginner pages answer
        run: |
          for path in / /guide /ur/guide /calculator; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 15 --max-time 30 "$SITE$path")
            echo "$path: $code"
            [ "$code" = "200" ] || exit 1
          done
