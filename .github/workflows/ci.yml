name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply to a fresh database
        run: npm run db:migrate
        env:
          DATABASE_URL: file:ci.db
      - name: Schema and migrations agree
        run: |
          npx drizzle-kit generate --name drift-check
          test -z "$(git status --porcelain drizzle)"
      - run: npm run build
        env:
          DATABASE_URL: file:ci.db
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end (phone-size, production build)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
